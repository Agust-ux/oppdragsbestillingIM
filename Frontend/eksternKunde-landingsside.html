<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ekstern kunde Dashboard</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/eksternkunde-landingsside.css">
</head>
<body>

<header>

  <nav class="navbar">

    <div class="logo">
      Oppdrag 2026
    </div>

    <ul class="nav-links">
      <li><a href="#">Mine oppdrag</a></li>
      <li><a href="#">Meldinger</a></li>
      <li><a href="#">Profil</a></li>
    </ul>

    <button class="login-btn">
      Logg ut
    </button>

  </nav>

</header>

<section class="dashboard">

  <h1>
    Velkommen tilbake
  </h1>

  <div class="customer-grid">

    <div class="customer-card">
      <h2>Aktive oppdrag</h2>
      <p>3</p>
    </div>

    <div class="customer-card">
      <h2>Pågående meldinger</h2>
      <p>2</p>
    </div>

    <div class="customer-card">
      <h2>Ferdige prosjekter</h2>
      <p>9</p>
    </div>

  </div>

  <section class="project-section">

    <h2>Mine oppdrag</h2>

    <div class="project-card">

      <img src="placeholder.png" alt="placeholder">

      <div class="project-info">

        <h3>Oppdragstittel</h3>

        <p>
          Oppdatering på prosjektet ditt.
        </p>

        <span>Status: Pågår</span>

      </div>

      <button class="primary-btn">
        Les mer
      </button>

    </div>

  </section>

</section>

<script src="js/eksternKunde-landingsside.js"></script>

</body>
</html>
