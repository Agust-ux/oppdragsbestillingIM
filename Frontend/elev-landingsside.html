<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elev Dashboard</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/elev-landingsside.css">
</head>
<body>

<header>

  <nav class="navbar">

    <div class="logo">
      Oppdrag 2026
    </div>

    <ul class="nav-links">
      <li><a href="#">Dashboard</a></li>
      <li><a href="#">Oppdrag</a></li>
      <li><a href="#">Meldinger</a></li>
    </ul>

    <button class="login-btn">
      Logg ut
    </button>

  </nav>

</header>

<section class="dashboard">

  <h1>
    Velkommen tilbake, Fornavn
  </h1>

  <div class="stats-grid">

    <div class="stat-card">
      <h2>3</h2>
      <p>Aktive oppdrag</p>
    </div>

    <div class="stat-card">
      <h2>4</h2>
      <p>Krever handling</p>
    </div>

    <div class="stat-card">
      <h2>4</h2>
      <p>Kommende frister</p>
    </div>

    <div class="stat-card">
      <h2>0</h2>
      <p>Uleste meldinger</p>
    </div>

  </div>

  <section class="deadline-section">

    <h2>Kommende leveringsfrister</h2>

    <div class="task-card">

      <img src="placeholder.png" alt="placeholder">

      <div class="task-content">
        <h3>Oppdragstittel</h3>
        <p>Frist - Dato/Måned</p>

        <div class="progress-bar">
          <div class="progress progress-60"></div>
        </div>

        <span>Pågår 60%</span>
      </div>

    </div>

    <div class="task-card">

      <img src="placeholder.png" alt="placeholder">

      <div class="task-content">
        <h3>Oppdragstittel</h3>
        <p>Frist - Dato/Måned</p>

        <div class="progress-bar">
          <div class="progress progress-40"></div>
        </div>

        <span>Pågår 40%</span>
      </div>

    </div>

  </section>

</section>

<script src="js/elev-landingsside.js"></script>

</body>
</html>
