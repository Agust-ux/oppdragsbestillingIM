<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ansatt Dashboard</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ansatte-landingsside.css">
</head>
<body>

<header>

  <nav class="navbar">

    <div class="logo">
      Oppdrag 2026
    </div>

    <ul class="nav-links">
      <li><a href="#">Dashboard</a></li>
      <li><a href="#">Oppdrag</a></li>
      <li><a href="#">Studenter</a></li>
    </ul>

    <button class="login-btn">
      Logg ut
    </button>

  </nav>

</header>

<section class="dashboard">

  <div class="top-section">

    <div>
      <h1>Velkommen tilbake</h1>
      <p>Administrer oppdrag og elevstatus.</p>
    </div>

    <div class="status-box">
      <h3>Status</h3>

      <button class="status-btn">
        Kan ta oppdrag
      </button>

      <button class="status-btn">
        Begrenset kapasitet
      </button>

      <button class="status-btn danger">
        Kan ikke ta oppdrag
      </button>
    </div>

  </div>

  <section class="oppdrag-section">

    <h2>Aktive oppdrag</h2>

    <div class="oppdrag-card">

      <img src="placeholder.png" alt="placeholder">

      <div>
        <h3>Oppdragstittel</h3>
        <p>Ansvarlig lærer: Fornavn Etternavn</p>
        <span>Eksternt oppdrag</span>
      </div>

      <button class="primary-btn">
        Les mer
      </button>

    </div>

  </section>

</section>

<script src="js/ansatte-landingsside.js"></script>

</body>
</html>
